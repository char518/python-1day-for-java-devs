[project]
name = "python-1day-for-java-devs-code"
version = "0.1.0"
description = "Companion code for the 1-day Python crash course (Java backend -> AI application development)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "openai>=1.40",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]